name: Release

# Triggered when a version tag like v1.0.0 is pushed
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  # ── Job 1: Linux binary + .deb + .rpm ───────────────────────────────────────
  build-linux:
    name: Build — Linux (binary, .deb, .rpm)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27'
          # No build cache in release builds: it is written by other runs.
          cache: false

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            gcc \
            libgl1-mesa-dev \
            xorg-dev \
            libx11-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxinerama-dev \
            libxi-dev \
            libwayland-dev \
            libxkbcommon-dev \
            dpkg-dev \
            rpm

      - name: Test
        run: go test ./...

      # The scripts build a packaged binary (updated by the package manager)
      # and package it with the .desktop file and icon. The standalone
      # binary is built separately: it updates itself and checks updates
      # against the release key (UPDATE_PUBLIC_KEY repository variable).
      - name: Build binary, .deb and .rpm
        env:
          TAG: ${{ github.ref_name }}
          UPDATE_PUBLIC_KEY: ${{ vars.UPDATE_PUBLIC_KEY }}
        run: |
          VERSION="${TAG#v}"
          bash install/build-deb.sh "$VERSION"
          bash install/build-rpm.sh "$VERSION"
          mkdir -p out
          cp dist/deb/*.deb dist/rpm/*.rpm out/
          if [[ ! "$UPDATE_PUBLIC_KEY" =~ ^[A-Za-z0-9+/]{43}=$ ]]; then
            echo "::warning::UPDATE_PUBLIC_KEY is not set: the Linux binary of this release will not update itself"
            UPDATE_PUBLIC_KEY=""
          fi
          go build -trimpath \
            -ldflags "-s -w -X main.Version=${VERSION} -X mtssh/core.UpdatePublicKey=${UPDATE_PUBLIC_KEY}" \
            -o out/mtssh-linux-amd64 .

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux
          path: out/*
          if-no-files-found: error

  # ── Job 2: Windows EXE ─────────────────────────────────────────────────────
  build-windows:
    name: Build — Windows EXE (cross-compile)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27'
          # No build cache in release builds: it is written by other runs.
          cache: false

      - name: Install MinGW cross-compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Cross-compile Windows EXE
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '1'
          CC: x86_64-w64-mingw32-gcc
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p out
          go build -trimpath \
            -ldflags "-s -w -H windowsgui -X main.Version=${TAG#v}" \
            -o out/mtssh-windows-amd64.exe \
            .

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows
          path: out/*
          if-no-files-found: error

  # ── Job 3: create the release once, with signed checksums ──────────────────
  # A single job publishes everything: parallel jobs each creating the same
  # release race against each other. The updater requires SHA256SUMS and
  # its signature SHA256SUMS.sig. The signing key is a secret of the
  # "release" environment — protect it with required reviewers in the
  # repository settings, so a pushed tag alone cannot publish.
  publish:
    name: Publish release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27'
          cache: false

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: out
          merge-multiple: true

      - name: Generate checksums
        working-directory: out
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Sign checksums
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::warning::UPDATE_SIGNING_KEY is not set: no SHA256SUMS.sig, clients will not update in place"
            exit 0
          fi
          go run ./tools/signsums out/SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: out/*
          body: |
            ## MTSSH ${{ github.ref_name }}

            ### Downloads

            | File | Platform | Install |
            |---|---|---|
            | `mtssh-linux-amd64` | Linux (amd64) | `chmod +x mtssh-linux-amd64 && ./mtssh-linux-amd64` |
            | `mtssh_*_amd64.deb` | Debian / Ubuntu | `sudo dpkg -i mtssh_*_amd64.deb` |
            | `mtssh-*.x86_64.rpm` | Fedora / RHEL | `sudo rpm -i mtssh-*.rpm` |
            | `mtssh-windows-amd64.exe` | Windows 10/11 | Double-click or run from terminal |
            | `SHA256SUMS` | all | `sha256sum -c SHA256SUMS --ignore-missing` |
            | `SHA256SUMS.sig` | all | Ed25519 signature of `SHA256SUMS`, checked by the updater |

            ### First run
            On first launch you will be asked to set a master passphrase.
            This passphrase encrypts all stored SSH sessions (Argon2id + AES-256-GCM).
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
