name: Release

# Triggered when a version tag like v1.0.0 is pushed
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  # ── Job 1: Linux binary + .deb + .rpm ───────────────────────────────────────
  build-linux:
    name: Build — Linux (binary, .deb, .rpm)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27'
          # No build cache in release builds: it is written by other runs.
          cache: false

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            gcc \
            libgl1-mesa-dev \
            xorg-dev \
            libx11-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxinerama-dev \
            libxi-dev \
            libwayland-dev \
            libxkbcommon-dev \
            dpkg-dev \
            rpm

      - name: Test
        run: go test ./...

      # The scripts build a packaged binary (updated by the package manager)
      # and package it with the .desktop file and icon. The standalone
      # binary is built separately: it updates itself. All of them embed the
      # release key (UPDATE_PUBLIC_KEY repository variable; the scripts read
      # it from the environment) and announce only releases signed with it.
      # Without a valid key the job fails: the standalone binary could never
      # update itself again. Set the variable ALLOW_UNSIGNED_RELEASE to
      # "true" to publish such a release anyway.
      - name: Build binary, .deb and .rpm
        env:
          TAG: ${{ github.ref_name }}
          UPDATE_PUBLIC_KEY: ${{ vars.UPDATE_PUBLIC_KEY }}
          ALLOW_UNSIGNED_RELEASE: ${{ vars.ALLOW_UNSIGNED_RELEASE }}
        run: |
          VERSION="${TAG#v}"
          if [[ ! "$UPDATE_PUBLIC_KEY" =~ ^[A-Za-z0-9+/]{43}=$ ]]; then
            if [[ "$ALLOW_UNSIGNED_RELEASE" != "true" ]]; then
              echo "::error::UPDATE_PUBLIC_KEY is missing or not a base64 Ed25519 public key (see tools/signsums -genkey). Set it, or set ALLOW_UNSIGNED_RELEASE=true to publish a Linux binary that cannot update itself."
              exit 1
            fi
            echo "::warning::UPDATE_PUBLIC_KEY is not set: the Linux binary of this release will not update itself"
            UPDATE_PUBLIC_KEY=""
          fi
          # build-deb.sh and build-rpm.sh embed $UPDATE_PUBLIC_KEY (exported:
          # it came from the step's env).
          bash install/build-deb.sh "$VERSION"
          bash install/build-rpm.sh "$VERSION"
          mkdir -p out
          cp dist/deb/*.deb dist/rpm/*.rpm out/
          go build -trimpath \
            -ldflags "-s -w -X main.Version=${VERSION} -X mtssh/core.UpdatePublicKey=${UPDATE_PUBLIC_KEY}" \
            -o out/mtssh-linux-amd64 .

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux
          path: out/*
          if-no-files-found: error

  # ── Job 2: Windows EXE ─────────────────────────────────────────────────────
  build-windows:
    name: Build — Windows EXE (cross-compile)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27'
          # No build cache in release builds: it is written by other runs.
          cache: false

      - name: Install MinGW cross-compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-mingw-w64-x86-64

      # The EXE opens the release page instead of updating itself, but it
      # embeds the release key too: it then announces only releases signed
      # with it. Same key check as in the Linux job.
      - name: Cross-compile Windows EXE
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '1'
          CC: x86_64-w64-mingw32-gcc
          TAG: ${{ github.ref_name }}
          UPDATE_PUBLIC_KEY: ${{ vars.UPDATE_PUBLIC_KEY }}
          ALLOW_UNSIGNED_RELEASE: ${{ vars.ALLOW_UNSIGNED_RELEASE }}
        run: |
          if [[ ! "$UPDATE_PUBLIC_KEY" =~ ^[A-Za-z0-9+/]{43}=$ ]]; then
            if [[ "$ALLOW_UNSIGNED_RELEASE" != "true" ]]; then
              echo "::error::UPDATE_PUBLIC_KEY is missing or not a base64 Ed25519 public key (see tools/signsums -genkey). Set it, or set ALLOW_UNSIGNED_RELEASE=true to publish an EXE that announces releases without checking their signature."
              exit 1
            fi
            echo "::warning::UPDATE_PUBLIC_KEY is not set: the Windows EXE of this release announces releases without checking their signature"
            UPDATE_PUBLIC_KEY=""
          fi
          mkdir -p out
          go build -trimpath \
            -ldflags "-s -w -H windowsgui -X main.Version=${TAG#v} -X mtssh/core.UpdatePublicKey=${UPDATE_PUBLIC_KEY}" \
            -o out/mtssh-windows-amd64.exe \
            .

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows
          path: out/*
          if-no-files-found: error

  # ── Job 3: create the release once, with signed checksums ──────────────────
  # A single job publishes everything: parallel jobs each creating the same
  # release race against each other. Clients with the release key announce
  # a release only with SHA256SUMS and its signature SHA256SUMS.sig. The
  # signing key is a secret of the "release" environment: limit it to
  # protected v* tags and require reviewers in the repository settings (see
  # README), so a pushed tag alone cannot publish. The checks below help
  # only for tags on commits that contain them; a tag on an older commit
  # runs that commit's workflow.
  publish:
    name: Publish release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write

    steps:
      # The signer is built from the default branch, not from the tag: a
      # tag can point to any pushed commit, including one whose
      # tools/signsums sends the key elsewhere. Nothing from the tag is
      # checked out in this job; its build artifacts are only hashed.
      - name: Check out the signer (default branch)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: signer
          # Whole history, for the ancestry check below.
          fetch-depth: 0
          persist-credentials: false

      # Sign only commits that are on the default branch, i.e. went through
      # its review, and only with a signer from that branch.
      - name: Check that the tag is on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -z "$DEFAULT_BRANCH" ]; then
            echo "::error::The repository's default branch is unknown: refusing to sign"
            exit 1
          fi
          default="refs/remotes/origin/$DEFAULT_BRANCH"
          if [ "$(git -C signer rev-parse HEAD)" != "$(git -C signer rev-parse --verify "$default^{commit}")" ]; then
            echo "::error::signer/ is not at the tip of $DEFAULT_BRANCH: refusing to sign"
            exit 1
          fi
          # Exit status 1: not an ancestor; 128: commit unknown. Both refuse.
          if ! git -C signer merge-base --is-ancestor "$GITHUB_SHA" "$default"; then
            echo "::error::The tagged commit $GITHUB_SHA is not on $DEFAULT_BRANCH: refusing to sign it"
            exit 1
          fi
          echo "Tagged commit $GITHUB_SHA is on $DEFAULT_BRANCH."

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27'
          cache: false

      # Built before any step has the key. Standard library only: no
      # modules are downloaded.
      - name: Build the signer
        working-directory: signer
        run: go build -trimpath -o "$RUNNER_TEMP/signsums" ./tools/signsums

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: out
          merge-multiple: true

      - name: Generate checksums
        working-directory: out
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      # The signature covers the version (the tag without "v", not the
      # .deb/.rpm form 1.2.0~rc1) and SHA256SUMS, so the updater only
      # accepts it for this release. Without the signing key the job fails
      # unless ALLOW_UNSIGNED_RELEASE is "true". Such a release is not
      # announced at all by clients built with the release key (every
      # release build with UPDATE_PUBLIC_KEY set, Windows and packages
      # included); only builds without the key point to it.
      - name: Sign checksums
        env:
          TAG: ${{ github.ref_name }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          ALLOW_UNSIGNED_RELEASE: ${{ vars.ALLOW_UNSIGNED_RELEASE }}
        run: |
          VERSION="${TAG#v}"
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            if [ "$ALLOW_UNSIGNED_RELEASE" != "true" ]; then
              echo "::error::UPDATE_SIGNING_KEY is not set. Set it in the release environment, or set ALLOW_UNSIGNED_RELEASE=true to publish without SHA256SUMS.sig (clients with the release key will not announce the release)."
              exit 1
            fi
            echo "::warning::UPDATE_SIGNING_KEY is not set: no SHA256SUMS.sig, clients with the release key will not announce this release"
            exit 0
          fi
          "$RUNNER_TEMP/signsums" -version "$VERSION" out/SHA256SUMS

      # Check the signature against the public key the release binaries
      # embed, the way the updater will.
      - name: Verify signature
        env:
          TAG: ${{ github.ref_name }}
          UPDATE_PUBLIC_KEY: ${{ vars.UPDATE_PUBLIC_KEY }}
          ALLOW_UNSIGNED_RELEASE: ${{ vars.ALLOW_UNSIGNED_RELEASE }}
        run: |
          VERSION="${TAG#v}"
          if [ "$ALLOW_UNSIGNED_RELEASE" = "true" ] && { [ ! -f out/SHA256SUMS.sig ] || [ -z "$UPDATE_PUBLIC_KEY" ]; }; then
            echo "::warning::Unsigned release (ALLOW_UNSIGNED_RELEASE): signature not checked"
            exit 0
          fi
          if ! "$RUNNER_TEMP/signsums" -verify -version "$VERSION" -pubkey "$UPDATE_PUBLIC_KEY" out/SHA256SUMS; then
            echo "::error::SHA256SUMS.sig does not verify for version $VERSION with UPDATE_PUBLIC_KEY: the updater would reject this release"
            exit 1
          fi

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: out/*
          body: |
            ## MTSSH ${{ github.ref_name }}

            ### Downloads

            | File | Platform | Install |
            |---|---|---|
            | `mtssh-linux-amd64` | Linux (amd64) | `chmod +x mtssh-linux-amd64 && ./mtssh-linux-amd64` |
            | `mtssh_*_amd64.deb` | Debian / Ubuntu | `sudo dpkg -i mtssh_*_amd64.deb` |
            | `mtssh-*.x86_64.rpm` | Fedora / RHEL | `sudo rpm -i mtssh-*.rpm` |
            | `mtssh-windows-amd64.exe` | Windows 10/11 | Double-click or run from terminal |
            | `SHA256SUMS` | all | `sha256sum -c SHA256SUMS --ignore-missing` |
            | `SHA256SUMS.sig` | all | Ed25519 signature of the version and `SHA256SUMS`, checked by the updater |

            ### First run
            On first launch you will be asked to set a master passphrase.
            This passphrase encrypts all stored SSH sessions (Argon2id + AES-256-GCM).
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
