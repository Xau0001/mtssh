name: Release

# Triggered when a version tag like v1.0.0 is pushed
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  # ── Job 1: Linux binary + .deb + .rpm ───────────────────────────────────────
  build-linux:
    name: Build — Linux (binary, .deb, .rpm)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            gcc \
            libgl1-mesa-dev \
            xorg-dev \
            libx11-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxinerama-dev \
            libxi-dev \
            dpkg-dev \
            rpm

      - name: Test
        run: go test ./...

      # The scripts build ./mtssh with main.Version set and package it
      # together with the .desktop file and icon.
      - name: Build binary, .deb and .rpm
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          bash install/build-deb.sh "$VERSION"
          bash install/build-rpm.sh "$VERSION"
          mkdir -p out
          cp mtssh out/mtssh-linux-amd64
          cp dist/deb/*.deb dist/rpm/*.rpm out/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/*
          if-no-files-found: error

  # ── Job 2: Windows EXE ─────────────────────────────────────────────────────
  build-windows:
    name: Build — Windows EXE (cross-compile)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Install MinGW cross-compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Cross-compile Windows EXE
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '1'
          CC: x86_64-w64-mingw32-gcc
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p out
          go build \
            -ldflags "-s -w -H windowsgui -X main.Version=${TAG#v}" \
            -o out/mtssh-windows-amd64.exe \
            .

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*
          if-no-files-found: error

  # ── Job 3: create the release once, with checksums ─────────────────────────
  # A single job publishes everything: parallel jobs each creating the same
  # release race against each other. SHA256SUMS is required by the updater.
  publish:
    name: Publish release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Generate checksums
        working-directory: out
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          body: |
            ## MTSSH ${{ github.ref_name }}

            ### Downloads

            | File | Platform | Install |
            |---|---|---|
            | `mtssh-linux-amd64` | Linux (amd64) | `chmod +x mtssh-linux-amd64 && ./mtssh-linux-amd64` |
            | `mtssh_*_amd64.deb` | Debian / Ubuntu | `sudo dpkg -i mtssh_*_amd64.deb` |
            | `mtssh-*.x86_64.rpm` | Fedora / RHEL | `sudo rpm -i mtssh-*.rpm` |
            | `mtssh-windows-amd64.exe` | Windows 10/11 | Double-click or run from terminal |
            | `SHA256SUMS` | all | `sha256sum -c SHA256SUMS --ignore-missing` |

            ### First run
            On first launch you will be asked to set a master passphrase.
            This passphrase encrypts all stored SSH sessions (Argon2id + AES-256-GCM).
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
